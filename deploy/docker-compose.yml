# Tinted gateway inside a dstack confidential VM (Phala Cloud). The image is pinned by digest, so the compose hash in
# the TDX quote identifies the exact build; /var/run/dstack.sock gives the gateway its KMS-derived keys and quotes.
# Secrets (provider API keys) are passed as Phala Cloud encrypted env vars, decrypted only inside the VM.
services:
  gateway:
    image: ghcr.io/tintedmarket/tinted-gateway@sha256:c564ed5ca714d33fb48fd953c5c1539065a2303d32cd32b783531253e05a27ec
    restart: always
    ports:
      - "8787:8787"
    environment:
      - REDPILL_API_KEY
      - TINFOIL_API_KEY
      - TINTED_ADMIN_TOKEN
      - SOLANA_RPC_URL
      - TINTED_TREASURY
      - TINTED_ANCHOR_MINUTES=60
      - TINTED_MARGIN=0.15
      - PORT=8787
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - tinted-data:/app/.data
  # api.tinted.market: TLS terminated inside this VM. The certificate key is derived from the app's KMS key
  # (DETERMINISTIC_TLS_KEY) and never leaves the VM; the Phala gateway only forwards ciphertext by SNI. The certificate
  # and an attestation over it are served at https://api.tinted.market/evidences/. tls-alpn-01: no DNS credentials here.
  ingress:
    image: ghcr.io/dstack-tee/dstack-ingress:2.8@sha256:60e682449534715a2f2e5b72326ca4229209c8e26c931c6f34d27e02200ac086
    restart: always
    ports:
      - "443:443"
    environment:
      - CHALLENGE_TYPE=tls-alpn-01
      - DOMAIN=api.tinted.market
      - TARGET_ENDPOINT=http://gateway:8787
      - GATEWAY_DOMAIN=gateway.dstack-pha-prod5.phala.network
      - DETERMINISTIC_TLS_KEY=true
      - DNS_SETUP_MODE=wait
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - tinted-certs:/etc/letsencrypt
      - tinted-evidences:/evidences
volumes:
  tinted-data:
  tinted-certs:
  tinted-evidences:
